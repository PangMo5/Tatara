name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  build:
    needs: verify
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      ARCH: ${{ matrix.arch }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5.2.6
        with:
          version: 2026.10.25
      - name: Validate tag and source
        run: swift Scripts/Tatara.swift validate-release
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: swift Scripts/Tatara.swift import-certificate
      - name: Build and sign executable
        run: swift Scripts/Tatara.swift release-build
      - name: Notarize
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: swift Scripts/Tatara.swift notarize
      - name: Package
        run: swift Scripts/Tatara.swift package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: dist/*.tar.gz
      - name: Remove temporary signing material
        if: always()
        run: swift Scripts/Tatara.swift clean-signing
  publish:
    needs: build
    runs-on: xcode-27
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Assemble source and checksums
        run: swift Scripts/Tatara.swift assemble-release
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: swift Scripts/Tatara.swift publish
      - name: Verify public checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: swift Scripts/Tatara.swift verify-release

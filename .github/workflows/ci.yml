name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: astral-sh/setup-uv@v10
      - name: Toolchain
        run: swift --version
      - name: Resolve and generate
        run: swift Scripts/Tatara.swift generate --locked
      - name: Formatting, localization and notices
        run: swift Scripts/Tatara.swift lint
      - name: Test
        run: swift Scripts/Tatara.swift test
      - name: Build production runtime
        run: swift Scripts/Tatara.swift build Release
      - name: PTY runtime
        run: swift Scripts/Tatara.swift smoke DerivedData/Build/Products/Release/tatara
      - name: Search, scrollbar and loading responsiveness
        run: swift Scripts/Tatara.swift smoke DerivedData/Build/Products/Release/tatara --workspace
      - name: Wheel axes and sidebar scroll margins
        run: swift Scripts/Tatara.swift smoke DerivedData/Build/Products/Release/tatara --wheel
      - name: Tree, visual comments and saved filters
        run: swift Scripts/Tatara.swift smoke DerivedData/Build/Products/Release/tatara --features
      - name: Multiline editor and complete review preview
        run: swift Scripts/Tatara.swift smoke DerivedData/Build/Products/Release/tatara --editors
      - name: Large input and in-flight focus changes
        run: swift Scripts/Tatara.swift smoke DerivedData/Build/Products/Release/tatara --stress
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation
          path: .artifacts/

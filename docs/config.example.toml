theme = "mocha" # latte, frappe, macchiato, mocha
language = "en" # en, ko, ja, zh-Hans, zh-Hant
files_view = "tree" # tree or list
sidebar_width = 52 # preferred width in columns; minimum 24
wrap = true # source wrapping; w toggles it for the current session

# Each override replaces that action's bindings. Duplicates are an error.
# Single characters are case-sensitive; active multi-key motions are listed in help.
[keys]
quit = ["Q"]

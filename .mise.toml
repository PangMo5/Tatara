[tools]
"aqua:tuist/tuist" = "4.214.1"
swiftformat = "0.64.5"
"aqua:cli/cli" = "2.103.3"
"aqua:Wilfred/difftastic" = "0.72.0"
"aqua:jj-vcs/jj" = "0.46.0"
"aqua:gitleaks/gitleaks" = "8.30.1"
uv = "0.13.7"

[env]
DEVELOPER_DIR = "{{ env.DEVELOPER_DIR | default(value='/Applications/Xcode-27.2.0.app/Contents/Developer') }}"

[tasks.toolchain]
run = "swift Scripts/Tatara.swift toolchain"

[tasks.generate]
run = "swift Scripts/Tatara.swift generate"

[tasks.build]
run = "swift Scripts/Tatara.swift build"

[tasks.test]
run = "swift Scripts/Tatara.swift test"

[tasks.run]
run = "DerivedData/Build/Products/Debug/tatara"

[tasks.format]
run = "swift Scripts/Tatara.swift format"

[tasks.smoke]
run = "swift Scripts/Tatara.swift smoke DerivedData/Build/Products/Release/tatara --workspace"

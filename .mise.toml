[tools]
"aqua:tuist/tuist" = "4.207.0"
swiftformat = "0.63.0"
"aqua:cli/cli" = "2.100.0"
"aqua:Wilfred/difftastic" = "0.70.0"

[tasks.generate]
run = "swift Scripts/Tatara.swift generate"

[tasks.build]
run = "swift Scripts/Tatara.swift build"

[tasks.test]
run = "swift Scripts/Tatara.swift test"

[tasks.run]
run = "DerivedData/Build/Products/Debug/tatara"

[tasks.format]
run = "swift Scripts/Tatara.swift format"

[tasks.smoke]
run = "swift Scripts/Tatara.swift smoke DerivedData/Build/Products/Release/tatara --workspace"
